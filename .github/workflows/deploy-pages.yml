name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --registry=https://registry.npmjs.org/ --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Build for GitHub Pages
        run: npm run build:gh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: |
          SITE_URL="${{ steps.deployment.outputs.page_url }}"
          LOGIN_URL="${SITE_URL%/}/login"
          echo "Deployed site: $SITE_URL"
          echo "Login page: $LOGIN_URL"
          {
            echo "## GitHub Pages"
            echo ""
            echo "- Site: [$SITE_URL]($SITE_URL)"
            echo "- Login: [$LOGIN_URL]($LOGIN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
